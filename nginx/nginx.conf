events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone: 30 requests/second per client IP with 10 burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream backend_api {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server: Redirects to HTTPS or handles ACME challenges
    server {
        listen 80;
        server_name localhost al-ecommerce.mohitrajdeo.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health probes accessible directly on port 80 for load balancers
        location /healthz {
            proxy_pass http://backend_api/healthz;
            proxy_set_header Host $host;
        }

        location /readyz {
            proxy_pass http://backend_api/readyz;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Reverse Proxy with Security Headers
    server {
        listen 443 ssl http2;
        server_name localhost al-ecommerce.mohitrajdeo.in;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Production Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
